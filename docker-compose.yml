# version: "3"
services:
  openfaas-jekyll:
    command: >
      bash -lc "bundle check || bundle install && bundle exec jekyll build && bundle exec jekyll serve --config _config.yml,_config_dev.yml --force_polling --host 0.0.0.0 --port 4000"
    image: jekyll/jekyll:4
    volumes:
      - .:/srv/jekyll
      - site:/srv/jekyll/_site
    ports:
      - 4000:4000
    environment:
      - JEKYLL_UID=1000
      # Use the Bundler version present in the jekyll/jekyll:4 image, matching
      # what's recorded in Gemfile.lock (bundle install rewrote the pin from
      # 2.2.22 to 2.6.9 when this ran under the image's own bundler).
      - BUNDLE_VERSION=system
      - BUNDLER_VERSION=2.6.9

volumes:
  site:
